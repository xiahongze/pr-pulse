name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/pr-pulse.plasmoid
          generate_release_notes: true
